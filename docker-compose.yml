
services:
  # Banco de metadados do Airflow
  postgres-airflow:
    image: postgres:16
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_dev}
      POSTGRES_DB: airflow
    volumes:
      - .volumes/airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workflow_network
    restart: unless-stopped

  # Banco da aplicação
  postgres:
    image: postgres:16
    container_name: postgres_data_pipeline_platform
    environment:
      POSTGRES_USER: ${APP_DB_USER:-app_user}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-app_dev}
      POSTGRES_DB: ${APP_DB_NAME:-workflow_db}
    ports:
      - "5433:5432"
    volumes:
      - .volumes/database:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workflow_network
    restart: unless-stopped

  # Containers do airflow
  airflow-init:
    image: apache/airflow:2.10.5-python3.11
    container_name: airflow_workflow
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment: &airflow_environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow_dev}@postgres-airflow:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: >-
        astronomer-cosmos
        apache-airflow-providers-postgres
        dbt-core==1.9.4
        dbt-postgres==1.9.0
    volumes: &airflow_volumes
      - ./dags:/opt/airflow/dags
      - .volumes/logs:/opt/airflow/logs
      - ./dbt:/opt/airflow/dbt
    networks:
      - workflow_network
    command: >
      bash -c "
        airflow db migrate &&
        (airflow users create
          --username admin
          --password admin
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@example.com || true)
      "

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.11
    container_name: airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_environment
    volumes: *airflow_volumes
    ports:
      - "8080:8080"
    command: webserver
    networks:
      - workflow_network
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.11
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_environment
    volumes: *airflow_volumes
    command: scheduler
    networks:
      - workflow_network
    restart: unless-stopped

# Rede dos containers

networks:
  workflow_network:
    name: workflow_network
    driver: bridge