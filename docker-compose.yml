x-airflow-common: &airflow-common
  image: workflow-airflow:local
  build:
    context: .
    dockerfile: Dockerfile
  user: "${AIRFLOW_UID}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres-airflow:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Tolerância a pequenos desvios de relógio e a tasks que esperam na fila
    AIRFLOW__API_AUTH__JWT_LEEWAY: "60"
    AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME: "3600"
    # Dev: sem tela de login. Em produção, remova e configure usuários.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # Conexão usada pelo Cosmos (conn_id = app_postgres)
    AIRFLOW_CONN_APP_POSTGRES: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt:/opt/airflow/dbt
    - ./.volumes/logs:/opt/airflow/logs
  networks:
    - workflow_network

services:
  postgres-airflow:
    image: postgres:16
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - ./.volumes/airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workflow_network
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres_data_pipeline_platform
    environment:
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: ${APP_DB_NAME}
    ports:
      - "5433:5432"   # 5433 só para acesso do host; entre containers a porta é 5432
    volumes:
      - ./.volumes/database:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workflow_network
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    depends_on:
      postgres-airflow:
        condition: service_healthy
    command: db migrate

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow_apiserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    depends_on:
      airflow-apiserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: scheduler
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow_dag_processor
    depends_on:
      airflow-apiserver:
        condition: service_healthy
    command: dag-processor
    restart: unless-stopped

networks:
  workflow_network:
    name: workflow_network
    driver: bridge